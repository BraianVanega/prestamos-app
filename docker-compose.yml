services:
  db:
    image: postgres:17
    container_name: prestamos-db
    environment:
      POSTGRES_USER: prestamos
      POSTGRES_PASSWORD: prestamos
      POSTGRES_DB: prestamos
    ports:
      # 5433 en el host: el 5432 suele estar tomado por un Postgres local.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prestamos -d prestamos"]
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
